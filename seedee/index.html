    <div class="gatebody">
      <h1>O.E. SeeDee</h1>
      <p class="lede">A transfer pricing case. Explore it, then vote on four scenarios.</p>
      <form id="signin" novalidate>
        <label for="name">Your name</label>
        <div class="signrow">
          <input id="name" name="name" type="text" autocomplete="name" maxlength="80" required>
          <button class="primary" type="submit">Start</button>
        </div>
        <p class="err" id="name-err" hidden>Enter your name to start.</p>
      </form>
      <button class="link" id="gate-cancel" type="button" hidden></button>
      <p class="fine" id="gate-note"></p>
    </div>
  </section>

  <div id="journey" hidden>
    <div class="steprow">
      <nav class="ridge" id="ridge" aria-label="Steps"></nav>
      <div class="caption" aria-live="polite">
        <div class="k" id="capk"></div>
        <h1 id="cap"></h1>
      </div>
    </div>
    <main class="cols" id="cols">
      <div class="stagewrap" id="stage"></div>
      <aside class="side" id="side"></aside>
    </main>
    <nav class="pager" aria-label="Previous and next step">
      <button class="ghost" id="prev" type="button"></button>
      <span class="count" id="count"></span>
      <button class="primary" id="next" type="button"></button>
    </nav>
  </div>
